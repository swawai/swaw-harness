name: Change
description: Define one bounded repository change.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result should this change deliver?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What may change, and what is intentionally excluded?
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation scope
      description: Name the local tests, important scenarios, and known omissions.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
      placeholder: "- [ ] Observable result"
    validations:
      required: true
