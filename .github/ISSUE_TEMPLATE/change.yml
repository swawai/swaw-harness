name: Change
description: Define one bounded, reviewable change before implementation begins.
body:
  - type: markdown
    attributes:
      value: |
        This Issue is the change identity. State the intended result and constraints;
        implementation details may evolve, but scope changes must be recorded here first.

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What observable result must be true when this Issue is complete?
      placeholder: Describe one bounded result, not a list of unrelated edits.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this change needed now, and what problem does it solve?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which behaviors, modules, or repository entities may change?
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What related work is explicitly outside this change? Write "None" if empty.
    validations:
      required: true

  - type: textarea
    id: invariants
    attributes:
      label: Invariants
      description: Which existing contracts or behaviors must remain true? Write "None identified" if empty.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, independently verifiable completion conditions.
      placeholder: |
        - [ ] Behavior or artifact that can be inspected
        - [ ] Test or command and its expected result
    validations:
      required: true

  - type: textarea
    id: open_questions
    attributes:
      label: Open questions
      description: Record unresolved decisions instead of letting an Agent guess. Write "None" if resolved.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant rules, files, prior Issues, or external evidence.

  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: The outcome is bounded enough for one branch and one PR.
          required: true
        - label: Unknowns and assumptions are explicit; implementation will not silently decide them.
          required: true
        - label: Version-controlled changes will begin only after an Issue-linked branch exists.
          required: true
