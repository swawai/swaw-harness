name: Full validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows full validation
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tracked syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $syntaxErrors = [System.Collections.Generic.List[string]]::new()
          $powerShellFiles = @(git ls-files -- '*.ps1' '*.psm1' '*.psd1')
          foreach ($path in $powerShellFiles) {
            [byte[]]$encoded = [IO.File]::ReadAllBytes((Join-Path $PWD $path))
            if ($encoded.Length -lt 3 -or
                $encoded[0] -ne 0xEF -or
                $encoded[1] -ne 0xBB -or
                $encoded[2] -ne 0xBF) {
              [void]$syntaxErrors.Add("${path}: expected UTF-8 BOM")
              continue
            }
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            )
            foreach ($errorRecord in $errors) {
              [void]$syntaxErrors.Add("${path}: $($errorRecord.Message)")
            }
          }
          if ($syntaxErrors.Count -gt 0) {
            $syntaxErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Exercise root build and Windows publication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dataRepo = Join-Path $PWD 'data.repo'
          & .\bootstrap\windows\tests\root-build.ps1
          & .\bootstrap\windows\tests\main.ps1 `
            -DataRepo $dataRepo

      - name: Verify bounded native paths and toolchain locators
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dataRepo = Join-Path $PWD 'data.repo'
          & .\bootstrap\windows\tests\path-budget.ps1
          & .\bootstrap\windows\tests\process.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\toolchain-locator.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\toolchain-concurrency.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\deep-path.ps1 `
            -DataRepo $dataRepo

      - name: Test Core Rust workspace
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dataRepo = Join-Path $PWD 'data.repo'
          & .\bootstrap\windows\tests\core-rust.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\skill-invocation.ps1 `
            -DataRepo $dataRepo

      - name: Verify Bootstrap release and product builds
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dataRepo = Join-Path $PWD 'data.repo'
          & .\bootstrap\windows\tests\bootstrap-release.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\build-determinism.ps1 `
            -DataRepo $dataRepo
          & .\bootstrap\windows\tests\user.ps1 `
            -DataRepo $dataRepo
